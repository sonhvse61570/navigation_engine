name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - navigation_engine
        - navigation_engine_flutter
        - navigation_engine_flutter_map
        - navigation_engine_maplibre
        - navigation_engine_google_maps
        - navigation_engine_mapbox
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or a GPS trace helps most.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `flutter --version`, plus the device or simulator.
      render: shell
