name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test must fail the job, not burn the runner's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages

      - name: Analyze
        run: |
          for p in packages/*/; do
            echo "::group::analyze $p"
            (cd "$p" && flutter analyze --no-pub)
            echo "::endgroup::"
          done

      - name: Import every package in one app
        run: tool/import_all_check.sh

      - name: Test
        timeout-minutes: 20
        run: |
          for p in packages/*/; do
            echo "::group::test $p"
            (cd "$p" && flutter test --no-pub)
            echo "::endgroup::"
          done

      # Code whose behaviour differs under dart2js (tests tagged `js`, see
      # packages/navigation_engine_osrm/dart_test.yaml) also runs on node.
      - name: Test on JS
        timeout-minutes: 10
        run: |
          if command -v node > /dev/null; then
            (cd packages/navigation_engine_osrm && dart test -p node -t js)
          else
            echo "node not found: skipping the JS tests"
          fi
