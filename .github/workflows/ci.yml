name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test must fail the job, not burn the runner's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages

      - name: Analyze
        run: |
          for p in packages/*/; do
            echo "::group::analyze $p"
            (cd "$p" && flutter analyze --no-pub)
            echo "::endgroup::"
          done

      - name: Import every package in one app
        run: tool/import_all_check.sh

      - name: No old package names
        run: tool/old_names_check.sh

      - name: Test
        timeout-minutes: 20
        run: |
          for p in packages/*/; do
            echo "::group::test $p"
            (cd "$p" && flutter test --no-pub)
            echo "::endgroup::"
          done
          # The examples are apps of their own: their dependencies are
          # not in the workspace's package config, so each gets its own
          # `pub get` (a failure of that fails the job).
          for e in packages/*/example; do
            [ -d "$e/test" ] || continue
            echo "::group::test $e"
            (cd "$e" && flutter pub get && flutter test --no-pub)
            echo "::endgroup::"
          done

      # Code whose behaviour differs under dart2js (tests tagged `js`) also
      # runs as JS, in every package whose dart_test.yaml declares the `js`
      # tag: pure-Dart packages on node, Flutter packages on Chrome
      # (`dart test -p node` cannot load Flutter). On Chrome only
      # test/routing runs: every js test lives there, which keeps the run
      # short. Flutter finds Chrome as google-chrome or CHROME_EXECUTABLE.
      - name: Test on JS
        timeout-minutes: 15
        run: |
          status=0
          for p in packages/*/; do
            grep -qE '^[[:space:]]+js:' "$p/dart_test.yaml" 2> /dev/null || continue
            if grep -qE '^[[:space:]]+sdk:[[:space:]]+flutter' "$p/pubspec.yaml"; then
              if ! command -v google-chrome > /dev/null && [ -z "${CHROME_EXECUTABLE:-}" ]; then
                echo "Chrome not found: skipping the JS tests of $p"
                continue
              fi
              if [ ! -d "$p/test/routing" ]; then
                echo "::error::$p declares the js tag but has no test/routing"
                exit 1
              fi
              echo "::group::test on Chrome $p"
              (cd "$p" && flutter test --no-pub --platform chrome --tags js test/routing) || status=$?
            else
              if ! command -v node > /dev/null; then
                echo "node not found: skipping the JS tests of $p"
                continue
              fi
              echo "::group::test on node $p"
              (cd "$p" && dart test -p node -t js) || status=$?
            fi
            echo "::endgroup::"
            [ "$status" -eq 0 ] || exit "$status"
          done
