name: navigation_engine_mapbox_directions_example
description: Searches Mapbox for a destination, then asks Mapbox Directions for the routes to it and prints their manoeuvres and speed limits.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.8.0

dependencies:
  navigation_engine:
    path: ../../navigation_engine
  navigation_engine_mapbox_directions:
    path: ../

dependency_overrides:
  navigation_engine:
    path: ../../navigation_engine
  navigation_engine_osrm:
    path: ../../navigation_engine_osrm
  navigation_engine_mapbox_directions:
    path: ../

dev_dependencies:
  http: ^1.5.0
  lints: ^6.1.0
  test: ^1.26.0
