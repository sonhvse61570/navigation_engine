# Tests tagged `js` guard code whose behaviour differs under dart2js
# (32-bit bitwise operators in the polyline decoder, number formatting, the
# web's User-Agent, the token scrub's regular expressions). The default
# run, and `flutter test` in CI, run them on the VM like the rest. Run them
# on JS too with
#
#     dart test -p node -t js
#
# The platform is named on the command line, not here: `flutter test`
# rejects `node` in this file.
tags:
  js:
  # Live requests to Mapbox, billed to the token; skipped unless
  # MAPBOX_TOKEN is set (see test/live_test.dart).
  live:
