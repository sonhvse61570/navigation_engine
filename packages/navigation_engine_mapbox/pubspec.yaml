name: navigation_engine_mapbox
description: >-
  Smooth turn-by-turn navigation view for Mapbox (mapbox_maps_flutter), built on navigation_engine: heading-up follow camera, route line, vehicle puck, recenter.
version: 0.1.0
repository: https://github.com/sonhvse61570/navigation_engine/tree/main/packages/navigation_engine_mapbox
issue_tracker: https://github.com/sonhvse61570/navigation_engine/issues
topics:
  - navigation
  - maps
  - turn-by-turn

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  mapbox_maps_flutter: ^3.0.0
  navigation_engine: ^0.1.0
  navigation_engine_flutter: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
