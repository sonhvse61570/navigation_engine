  A navigation_engine voice module: speaks turn-by-turn prompts through the device's text-to-speech.
version: 0.1.0
repository: https://github.com/sonhvse61570/navigation_engine/tree/main/packages/navigation_tts
issue_tracker: https://github.com/sonhvse61570/navigation_engine/issues
topics:
  - navigation
