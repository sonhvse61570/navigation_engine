name: navigation_engine_google_routes_example
description: Searches Google Places for a destination, then asks the Google Routes API for the routes to it and prints their manoeuvres.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.8.0

dependencies:
  navigation_engine:
    path: ../../navigation_engine
  navigation_engine_google_routes:
    path: ../

dependency_overrides:
  navigation_engine:
    path: ../../navigation_engine
  navigation_engine_google_routes:
    path: ../

dev_dependencies:
  http: ^1.5.0
  lints: ^6.1.0
  test: ^1.26.0
