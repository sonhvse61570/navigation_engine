name: navigation_maplibre
description: >-
  A navigation_engine map adapter for MapLibre (maplibre_gl): heading-up follow camera, route line, vehicle puck and recenter button.
version: 0.1.0
repository: https://github.com/sonhvse61570/navigation_engine/tree/main/packages/navigation_maplibre
issue_tracker: https://github.com/sonhvse61570/navigation_engine/issues
topics:
  - navigation
  - maps
  - turn-by-turn
  - navigation-engine

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.27.1
  navigation_engine: ^0.1.0
  navigation_engine_flutter: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
